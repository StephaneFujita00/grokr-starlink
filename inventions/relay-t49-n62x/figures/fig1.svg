<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#ffffff"/>
  <!-- Battery block -->
  <rect x="40" y="180" width="140" height="200" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="60" y1="200" x2="160" y2="200" stroke="#111" stroke-width="1"/>
  <line x1="60" y1="220" x2="160" y2="220" stroke="#111" stroke-width="1"/>
  <line x1="60" y1="240" x2="160" y2="240" stroke="#111" stroke-width="1"/>
  <line x1="60" y1="260" x2="160" y2="260" stroke="#111" stroke-width="1"/>
  <line x1="60" y1="280" x2="160" y2="280" stroke="#111" stroke-width="1"/>
  <line x1="60" y1="300" x2="160" y2="300" stroke="#111" stroke-width="1"/>
  <line x1="60" y1="320" x2="160" y2="320" stroke="#111" stroke-width="1"/>
  <line x1="60" y1="340" x2="160" y2="340" stroke="#111" stroke-width="1"/>
  <text x="110" y="390" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">Battery (12)</text>
  <!-- Connector -->
  <line x1="180" y1="280" x2="230" y2="280" stroke="#111" stroke-width="2"/>
  <text x="205" y="265" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">Connector (14)</text>
  <!-- Voltage sensor -->
  <rect x="230" y="250" width="110" height="60" fill="none" stroke="#111" stroke-width="2"/>
  <text x="285" y="285" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Voltage sensor (16)</text>
  <!-- Connection line to modem -->
  <line x1="340" y1="280" x2="390" y2="280" stroke="#111" stroke-width="2"/>
  <!-- Modem processor -->
  <rect x="390" y="200" width="160" height="160" fill="none" stroke="#111" stroke-width="2"/>
  <text x="470" y="240" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">Modem processor (18)</text>
  <line x1="410" y1="260" x2="530" y2="260" stroke="#111" stroke-width="1"/>
  <line x1="410" y1="280" x2="530" y2="280" stroke="#111" stroke-width="1"/>
  <line x1="410" y1="300" x2="530" y2="300" stroke="#111" stroke-width="1"/>
  <line x1="410" y1="320" x2="530" y2="320" stroke="#111" stroke-width="1"/>
  <!-- Line to PA -->
  <line x1="470" y1="360" x2="470" y2="400" stroke="#111" stroke-width="2"/>
  <!-- Power amplifier -->
  <rect x="390" y="400" width="160" height="70" fill="none" stroke="#111" stroke-width="2"/>
  <text x="470" y="445" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">PA (20)</text>
  <!-- Line to Tx -->
  <line x1="550" y1="435" x2="600" y2="435" stroke="#111" stroke-width="2"/>
  <!-- Transmitter -->
  <rect x="600" y="400" width="100" height="70" fill="none" stroke="#111" stroke-width="2"/>
  <text x="650" y="445" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Tx (22)</text>
  <!-- Scaling register -->
  <rect x="550" y="320" width="100" height="50" fill="none" stroke="#111" stroke-width="2"/>
  <text x="600" y="350" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">Scaling reg (24)</text>
  <line x1="520" y1="345" x2="550" y2="345" stroke="#111" stroke-width="1.5"/>
  <!-- Flash memory -->
  <rect x="550" y="200" width="100" height="50" fill="none" stroke="#111" stroke-width="2"/>
  <text x="600" y="230" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">Flash (26)</text>
  <line x1="520" y1="225" x2="550" y2="225" stroke="#111" stroke-width="1.5"/>
  <!-- Hatching on battery section -->
  <path d="M50 190 L170 190 L170 370 L50 370 Z" fill="none" stroke="#111" stroke-width="0.5"/>
  <line x1="55" y1="195" x2="65" y2="185" stroke="#111" stroke-width="0.5"/>
  <line x1="75" y1="215" x2="85" y2="205" stroke="#111" stroke-width="0.5"/>
  <line x1="95" y1="235" x2="105" y2="225" stroke="#111" stroke-width="0.5"/>
  <line x1="115" y1="255" x2="125" y2="245" stroke="#111" stroke-width="0.5"/>
  <line x1="135" y1="275" x2="145" y2="265" stroke="#111" stroke-width="0.5"/>
  <line x1="155" y1="295" x2="165" y2="285" stroke="#111" stroke-width="0.5"/>
  <text x="400" y="580" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">FIG. 1</text>
</svg>
