<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#fff"/>
  <!-- Ephemeris block -->
  <rect x="80" y="120" width="140" height="80" fill="none" stroke="#111" stroke-width="2"/>
  <text x="150" y="165" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Ephemeris (20)</text>
  <!-- Firmware block -->
  <rect x="300" y="100" width="200" height="120" fill="none" stroke="#111" stroke-width="2"/>
  <text x="400" y="140" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Firmware (18)</text>
  <text x="400" y="160" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">Bias calc</text>
  <!-- Attitude command arrow -->
  <line x1="500" y1="160" x2="580" y2="160" stroke="#111" stroke-width="2"/>
  <polygon points="580,160 565,152 565,168" fill="#111"/>
  <!-- Reaction wheel -->
  <rect x="600" y="120" width="100" height="80" fill="none" stroke="#111" stroke-width="2"/>
  <text x="650" y="165" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">Reaction wheel (28)</text>
  <!-- Magnetorquer -->
  <rect x="600" y="240" width="100" height="60" fill="none" stroke="#111" stroke-width="2"/>
  <text x="650" y="275" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">Magnetorquer (30)</text>
  <!-- Satellite body feedback -->
  <line x1="650" y1="300" x2="650" y2="380" stroke="#111" stroke-width="2"/>
  <line x1="650" y1="380" x2="400" y2="380" stroke="#111" stroke-width="2"/>
  <line x1="400" y1="380" x2="400" y2="220" stroke="#111" stroke-width="2"/>
  <!-- Sensors -->
  <rect x="80" y="280" width="140" height="60" fill="none" stroke="#111" stroke-width="2"/>
  <text x="150" y="315" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">Thermal sensors (36)</text>
  <!-- Log buffer -->
  <rect x="300" y="280" width="140" height="60" fill="none" stroke="#111" stroke-width="2"/>
  <text x="370" y="315" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">Log buffer (32)</text>
  <!-- Memory -->
  <rect x="500" y="280" width="140" height="60" fill="none" stroke="#111" stroke-width="2"/>
  <text x="570" y="315" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">NVM (34)</text>
  <!-- Caption -->
  <text x="400" y="580" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle">FIG. 2</text>
</svg>