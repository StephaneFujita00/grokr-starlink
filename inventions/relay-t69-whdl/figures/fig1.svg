<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#fff"/>
  <!-- Satellite body -->
  <rect x="320" y="220" width="160" height="120" fill="none" stroke="#111" stroke-width="2"/>
  <text x="400" y="290" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">(10)</text>
  <!-- Solar array left -->
  <rect x="120" y="240" width="200" height="40" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="320" y1="260" x2="320" y2="260" stroke="#111" stroke-width="2"/>
  <!-- Solar array right -->
  <rect x="480" y="240" width="200" height="40" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="480" y1="260" x2="480" y2="260" stroke="#111" stroke-width="2"/>
  <text x="200" y="265" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">(14)</text>
  <!-- Gimbal -->
  <circle cx="320" cy="260" r="12" fill="none" stroke="#111" stroke-width="2"/>
  <text x="320" y="295" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">(16)</text>
  <!-- Phased array -->
  <rect x="360" y="340" width="80" height="30" fill="none" stroke="#111" stroke-width="2"/>
  <text x="400" y="385" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">(22)</text>
  <!-- Star tracker -->
  <rect x="280" y="180" width="30" height="20" fill="none" stroke="#111" stroke-width="2"/>
  <text x="295" y="175" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">(18)</text>
  <!-- Sun sensor -->
  <rect x="490" y="180" width="25" height="20" fill="none" stroke="#111" stroke-width="2"/>
  <text x="502" y="175" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">(20)</text>
  <!-- Flight computer box inside -->
  <rect x="370" y="250" width="50" height="30" fill="none" stroke="#111" stroke-width="2"/>
  <text x="395" y="270" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">(12)</text>
  <!-- Reaction wheel -->
  <circle cx="340" cy="300" r="15" fill="none" stroke="#111" stroke-width="2"/>
  <text x="340" y="320" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">(42)</text>
  <!-- Thruster -->
  <polygon points="300,280 310,270 310,290" fill="none" stroke="#111" stroke-width="2"/>
  <text x="285" y="285" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">(40)</text>
  <!-- Leader lines and labels -->
  <line x1="400" y1="340" x2="400" y2="400" stroke="#111" stroke-width="1"/>
  <line x1="200" y1="260" x2="150" y2="220" stroke="#111" stroke-width="1"/>
  <text x="120" y="215" font-family="Helvetica, Arial, sans-serif" font-size="11">(14) solar array</text>
  <line x1="320" y1="260" x2="280" y2="200" stroke="#111" stroke-width="1"/>
  <text x="240" y="195" font-family="Helvetica, Arial, sans-serif" font-size="11">(16) gimbal</text>
  <line x1="295" y1="190" x2="260" y2="160" stroke="#111" stroke-width="1"/>
  <text x="220" y="155" font-family="Helvetica, Arial, sans-serif" font-size="11">(18) star tracker</text>
  <line x1="502" y1="190" x2="530" y2="160" stroke="#111" stroke-width="1"/>
  <text x="535" y="155" font-family="Helvetica, Arial, sans-serif" font-size="11">(20) sun sensor</text>
  <line x1="400" y1="370" x2="400" y2="410" stroke="#111" stroke-width="1"/>
  <text x="400" y="425" font-family="Helvetica, Arial, sans-serif" font-size="11">(22) phased-array</text>
  <line x1="395" y1="265" x2="360" y2="240" stroke="#111" stroke-width="1"/>
  <text x="340" y="235" font-family="Helvetica, Arial, sans-serif" font-size="10">(12) flight computer</text>
  <line x1="340" y1="300" x2="310" y2="330" stroke="#111" stroke-width="1"/>
  <text x="290" y="335" font-family="Helvetica, Arial, sans-serif" font-size="10">(42) reaction wheel</text>
  <line x1="305" y1="280" x2="260" y2="310" stroke="#111" stroke-width="1"/>
  <text x="240" y="315" font-family="Helvetica, Arial, sans-serif" font-size="10">(40) thruster</text>
  <line x1="400" y1="280" x2="450" y2="250" stroke="#111" stroke-width="1"/>
  <text x="455" y="245" font-family="Helvetica, Arial, sans-serif" font-size="11">(10) satellite body</text>
  <!-- Observatory LOS arrow -->
  <line x1="400" y1="280" x2="550" y2="150" stroke="#111" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="560" y="145" font-family="Helvetica, Arial, sans-serif" font-size="11">LOS to observatory (34)</text>
  <!-- Sun vector -->
  <line x1="400" y1="280" x2="300" y2="120" stroke="#111" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="280" y="115" font-family="Helvetica, Arial, sans-serif" font-size="11">sun vector (36)</text>
  <text x="400" y="580" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">FIG. 1</text>
</svg>