<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#fff"/>
  <!-- Antenna dish -->
  <ellipse cx="150" cy="200" rx="120" ry="40" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="150" y1="200" x2="150" y2="320" stroke="#111" stroke-width="2"/>
  <!-- LNB housing -->
  <rect x="120" y="320" width="60" height="40" fill="none" stroke="#111" stroke-width="2"/>
  <text x="150" y="345" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">22</text>
  <!-- Waveguide to receiver -->
  <line x1="180" y1="340" x2="280" y2="340" stroke="#111" stroke-width="2"/>
  <!-- Demodulator box -->
  <rect x="280" y="300" width="100" height="80" fill="none" stroke="#111" stroke-width="2"/>
  <text x="330" y="340" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">24</text>
  <!-- Processor -->
  <rect x="420" y="280" width="120" height="60" fill="none" stroke="#111" stroke-width="2"/>
  <text x="480" y="315" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">26</text>
  <!-- OTP memory -->
  <rect x="420" y="360" width="80" height="40" fill="none" stroke="#111" stroke-width="2"/>
  <text x="460" y="385" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">14</text>
  <!-- Flash table -->
  <rect x="520" y="360" width="80" height="40" fill="none" stroke="#111" stroke-width="2"/>
  <text x="560" y="385" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">34</text>
  <!-- LO -->
  <rect x="280" y="420" width="80" height="50" fill="none" stroke="#111" stroke-width="2"/>
  <text x="320" y="450" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">28</text>
  <!-- Baseband -->
  <rect x="400" y="440" width="100" height="50" fill="none" stroke="#111" stroke-width="2"/>
  <text x="450" y="470" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">30</text>
  <!-- TCXO -->
  <rect x="550" y="440" width="60" height="40" fill="none" stroke="#111" stroke-width="2"/>
  <text x="580" y="465" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">36</text>
  <!-- Failure counter -->
  <rect x="620" y="300" width="60" height="40" fill="none" stroke="#111" stroke-width="2"/>
  <text x="650" y="325" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">16</text>
  <!-- Leader lines and labels -->
  <line x1="150" y1="240" x2="150" y2="280" stroke="#111" stroke-width="1"/>
  <text x="160" y="270" font-family="Helvetica, Arial, sans-serif" font-size="10">Antenna (20)</text>
  <line x1="330" y1="300" x2="330" y2="260" stroke="#111" stroke-width="1"/>
  <text x="340" y="255" font-family="Helvetica, Arial, sans-serif" font-size="10">Demod (24)</text>
  <line x1="480" y1="280" x2="480" y2="240" stroke="#111" stroke-width="1"/>
  <text x="490" y="235" font-family="Helvetica, Arial, sans-serif" font-size="10">Processor (26)</text>
  <line x1="460" y1="360" x2="460" y2="400" stroke="#111" stroke-width="1"/>
  <text x="470" y="410" font-family="Helvetica, Arial, sans-serif" font-size="10">OTP (14)</text>
  <line x1="560" y1="360" x2="560" y2="410" stroke="#111" stroke-width="1"/>
  <text x="570" y="420" font-family="Helvetica, Arial, sans-serif" font-size="10">Flash (34)</text>
  <line x1="320" y1="420" x2="320" y2="470" stroke="#111" stroke-width="1"/>
  <text x="330" y="485" font-family="Helvetica, Arial, sans-serif" font-size="10">LO (28)</text>
  <line x1="450" y1="490" x2="450" y2="520" stroke="#111" stroke-width="1"/>
  <text x="460" y="530" font-family="Helvetica, Arial, sans-serif" font-size="10">Baseband (30)</text>
  <line x1="580" y1="440" x2="580" y2="490" stroke="#111" stroke-width="1"/>
  <text x="590" y="500" font-family="Helvetica, Arial, sans-serif" font-size="10">TCXO (36)</text>
  <line x1="650" y1="300" x2="650" y2="260" stroke="#111" stroke-width="1"/>
  <text x="660" y="255" font-family="Helvetica, Arial, sans-serif" font-size="10">Counter (16)</text>
  <!-- Caption -->
  <text x="400" y="580" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">FIG. 1</text>
</svg>